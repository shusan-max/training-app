<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホの画面幅に合わせる。viewport-fit=cover は iPhone の画面の端まで使うための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <title>トレーニング</title>

  <!-- ホーム画面に追加したときの名前・アイコン・表示のしかた -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="トレーニング">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 画面上部のタイトル -->
  <header class="app-header">
    <h1 id="screen-title"></h1>
  </header>

  <!-- ここに各画面の中身が入る(js/screens/ のファイルが書き込む) -->
  <main id="screen" class="screen"></main>

  <!-- 画面下のタブ。親指で押しやすいように下に置く -->
  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>今日</span>
    </a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>
      <span>記録</span>
    </a>
    <a href="#progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>
      <span>進捗</span>
    </a>
    <a href="#exercises" data-tab="exercises">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
      <span>種目</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>設定</span>
    </a>
  </nav>
</body>
</html>
